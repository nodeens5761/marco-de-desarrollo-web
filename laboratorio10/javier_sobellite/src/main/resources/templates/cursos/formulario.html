<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${tituloPagina})}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario de curso</title>
    <link rel="stylesheet" href="../../static/css/site.css">
</head>
<body class="d-flex flex-column min-vh-100">
<a class="visually-hidden-focusable position-absolute p-2 bg-white"
    href="#contenido">Saltar al contenido</a>
<header th:replace="~{fragments/layout :: cabecera}">
    <nav><a href="/cursos">TechLab Web</a></nav>
</header>
<main id="contenido" class="container py-5">
    <section class="form-panel mx-auto">
        <p class="text-primary fw-semibold mb-2">Gestión del catálogo</p>
        <h1 class="display-6 fw-bold" th:text="${tituloPagina}">
            Nuevo curso
        </h1>
        <p class="text-body-secondary">
            Los campos marcados como obligatorios se verifican también en el servidor.
        </p>
        <div class="alert alert-danger" role="alert"
            th:if="${error}" th:text="${error}">
            Revise los datos enviados
        </div>
        <form method="post" th:object="${form}"
            th:action="${cursoId == null}
                ? @{/cursos}
                : @{/cursos/{id}(id=${cursoId})}">
            <input type="hidden" th:if="${cursoId != null}"
                th:field="*{version}">
            <div class="mb-3">
                <label class="form-label" for="titulo">Título</label>
                <input class="form-control" id="titulo" type="text"
                    th:field="*{titulo}" required maxlength="120"
                    aria-describedby="titulo-ayuda">
                <div id="titulo-ayuda" class="form-text">
                    Use un nombre único de hasta 120 caracteres.
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label" for="horas">Horas</label>
                <input class="form-control" id="horas" type="number"
                    th:field="*{horas}" required min="1" max="500"
                    inputmode="numeric" aria-describedby="horas-ayuda">
                <div id="horas-ayuda" class="form-text">
                    Ingrese un valor entero entre 1 y 500.
                </div>
            </div>
            <div class="d-flex flex-wrap gap-2">
                <button class="btn btn-primary" type="submit"
                    th:text="${textoBoton}">Guardar</button>
                <a class="btn btn-outline-secondary"
                    href="lista.html" th:href="@{/cursos}">Cancelar</a>
            </div>
        </form>
    </section>
</main>
<footer th:replace="~{fragments/layout :: pie}">
    <p>TechLab Web · 2026</p>
</footer>
</body>
</html>
