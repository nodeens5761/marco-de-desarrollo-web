<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | TechLab Web'">TechLab Web</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
    <link rel="stylesheet"
        href="../static/css/site.css"
        th:href="@{/css/site.css}">
</head>
<body>
<header th:fragment="cabecera" class="border-bottom bg-white">
    <nav class="container d-flex flex-wrap align-items-center gap-3 py-3"
        aria-label="Navegación principal">
        <a class="navbar-brand fw-semibold me-auto"
            href="/cursos" th:href="@{/cursos}">TechLab Web</a>
        <a class="link-body-emphasis text-decoration-none"
            href="/cursos" th:href="@{/cursos}">Cursos</a>
        <a class="link-body-emphasis text-decoration-none"
            href="/cursos/nuevo" th:href="@{/cursos/nuevo}">Nuevo curso</a>
        <a class="link-body-emphasis text-decoration-none"
            href="/cursos/resumen" th:href="@{/cursos/resumen}">Resumen</a>
        <a class="link-body-emphasis text-decoration-none"
            href="/api/v1/cursos" th:href="@{/api/v1/cursos}">API JSON</a>
    </nav>
</header>
<footer th:fragment="pie" class="border-top bg-white mt-auto">
    <div class="container py-3 small text-body-secondary">
        TechLab Web · Marcos de Desarrollo Web · 2026
    </div>
    <script src="../static/js/site.js"
        th:src="@{/js/site.js}" defer></script>
</footer>
</body>
</html>
