<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Resumen de cursos')}"></head>
<body class="d-flex flex-column min-vh-100">
<header th:replace="~{fragments/layout :: cabecera}"></header>
<main class="container py-5">
  <h1 class="display-6 fw-bold mb-4">Resumen de cursos</h1>
  <div class="row g-3">
    <div class="col-md-6"><section class="summary-card"><p class="text-body-secondary mb-1">Cursos registrados</p><p class="display-5 fw-bold mb-0" th:text="${cantidadCursos}">3</p></section></div>
    <div class="col-md-6"><section class="summary-card"><p class="text-body-secondary mb-1">Horas acumuladas</p><p class="display-5 fw-bold mb-0" th:text="${totalHoras}">68</p></section></div>
  </div>
  <a class="btn btn-primary mt-4" th:href="@{/cursos}">Volver al catálogo</a>
</main>
<footer th:replace="~{fragments/layout :: pie}"></footer>
</body>
</html>
