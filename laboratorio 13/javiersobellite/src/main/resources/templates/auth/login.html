<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | TechLab</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body class="auth-page">
<div class="auth-shell">
    <a class="brand auth-brand" th:href="@{/cursos}">TechLab</a>
    <main class="auth-card">
        <div class="auth-heading">
            <span class="auth-mark" aria-hidden="true">T</span>
            <p class="eyebrow">ÁREA DE ACCESO</p>
            <h1>Bienvenido</h1>
            <p class="muted">Inicia sesión para gestionar los cursos.</p>
        </div>
        <div class="notice error" role="alert" th:if="${param.error}">
            El usuario o la contraseña no son correctos.
        </div>
        <div class="notice success" role="status" th:if="${param.logout}">
            Has cerrado sesión correctamente.
        </div>
        <form method="post" th:action="@{/login}" class="auth-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="field">
                <label for="username">Usuario</label>
                <input id="username" name="username" type="text" autocomplete="username" required autofocus>
            </div>
            <div class="field">
                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button class="button primary auth-submit" type="submit">Ingresar</button>
        </form>
        <a class="back-link" th:href="@{/cursos}">Volver al catálogo</a>
    </main>
    <footer>TechLab · Gestión académica</footer>
</div>
</body>
</html>
