<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi sesión | TechLab</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>
<div class="container narrow">
    <div th:replace="~{fragments/layout :: header}"></div>
    <main>
        <p class="eyebrow">CUENTA</p>
        <h1>Mi sesión</h1>
        <section class="panel profile-card">
            <span class="profile-avatar" aria-hidden="true">U</span>
            <div>
                <span class="detail-label">Sesión iniciada como</span>
                <h2 class="profile-name" th:text="${security.username}">usuario</h2>
                <p class="muted">Tu identidad ha sido verificada para esta sesión.</p>
            </div>
        </section>
        <a class="button secondary" th:href="@{/cursos}">Volver a cursos</a>
    </main>
    <footer>TechLab · Gestión académica</footer>
</div>
</body>
</html>
