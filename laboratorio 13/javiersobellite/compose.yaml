name: techlab-semana13
services:
  mysql:
    image: mysql:8.4
    container_name: techlab-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: techlab
      MYSQL_USER: techlab
      MYSQL_PASSWORD: ${TECHLAB_DB_PASSWORD:?Defina TECHLAB_DB_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${TECHLAB_ROOT_PASSWORD:?Defina TECHLAB_ROOT_PASSWORD en .env}
    ports:
      - "3306:3306"
    volumes:
      - techlab_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  techlab_mysql_data:
