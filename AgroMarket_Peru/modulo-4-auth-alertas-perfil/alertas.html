<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>AgroMarketPeru · Mis alertas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/shared/styles.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div id="commonNav"></div>
    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div><span class="text-success fw-semibold">SEGUIMIENTO</span>
                <h1 class="h3">Mis alertas de precio</h1>
            </div>
        </div>
        <div class="card border-0 soft-shadow mb-4">
            <div class="card-body">
                <h2 class="h5">Crear nueva alerta</h2>
                <form id="alertForm" class="row g-3" novalidate>
                    <div class="col-md-8"><select id="alertProducto" class="form-select" required>
                            <option value="">Selecciona un producto</option>
                        </select></div>
                    <div class="col-md-4">
                        <div class="input-group"><span class="input-group-text">S/</span><input id="alertPrecio"
                                class="form-control" type="number" min="0.01" step="0.01" required
                                placeholder="Precio objetivo"></div>
                    </div>
                    <div class="col-12"><button class="btn btn-warning"><i class="bi bi-bell-fill me-1"></i>Guardar
                            alerta</button></div>
                </form>
            </div>
        </div>
        <div id="alerts" class="row g-3"></div>
    </main>
    <div id="commonFooter"></div>
    <script src="/shared/shared.js"></script>
    <script src="/modulo-1-datos-backend/app.js"></script>
    <script src="app.js"></script>
</body>

</html>
