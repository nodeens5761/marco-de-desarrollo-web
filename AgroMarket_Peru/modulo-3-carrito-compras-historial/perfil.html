<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>AgroMarketPeru · Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/shared/styles.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div id="commonNav"></div>
    <main class="container py-4">
        <div class="card border-0 soft-shadow mx-auto" style="max-width:760px">
            <div class="card-body p-4 p-md-5">
                <div class="d-flex align-items-center gap-3 mb-4">
                    <div
                        class="profile-avatar bg-success-subtle rounded-circle d-flex align-items-center justify-content-center">
                        <i class="bi bi-person-fill fs-1 text-success"></i></div>
                    <div><span class="badge text-bg-success">Cuenta cliente</span>
                        <h1 class="h3 mt-2">Mi perfil</h1>
                    </div>
                </div>
                <form id="profileForm" class="row g-3" novalidate>
                    <div class="col-md-6"><label class="form-label">Nombre</label><input id="pNombre"
                            class="form-control" required></div>
                    <div class="col-md-6"><label class="form-label">Correo</label><input id="pCorreo"
                            class="form-control" disabled></div>
                    <div class="col-md-6"><label class="form-label">Celular</label><input id="pTelefono"
                            class="form-control" pattern="[0-9]{9}"></div>
                    <div class="col-md-6"><label class="form-label">DNI</label><input id="pDni" class="form-control"
                            pattern="[0-9]{8}"></div>
                    <div class="col-md-8"><label class="form-label">Dirección</label><input id="pDireccion"
                            class="form-control"></div>
                    <div class="col-md-4"><label class="form-label">Distrito</label><input id="pDistrito"
                            class="form-control"></div>
                    <div class="col-12">
                        <div id="profileMsg"></div><button class="btn btn-success" type="submit">Guardar
                            cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <div id="commonFooter"></div>
    <script src="/shared/shared.js"></script>
    <script src="/modulo-1-datos-backend/app.js"></script>
    <script src="app.js"></script>
</body>

</html>
