<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>AgroMarketPeru · Carrito</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/shared/styles.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div id="commonNav"></div>
    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div><span class="text-success fw-semibold">TU PEDIDO</span>
                <h1 class="h3 mb-0">Carrito de compras</h1>
            </div><a class="btn btn-outline-dark" href="/modulo-2-catalogo/index.html">Seguir comprando</a>
        </div>
        <div class="row g-4">
            <section class="col-lg-8">
                <div class="card border-0 soft-shadow">
                    <div class="card-body">
                        <div id="cartItems"></div>
                    </div>
                </div>
            </section>
            <aside class="col-lg-4">
                <div id="summary" class="card border-0 soft-shadow sticky-lg-top d-none" style="top:84px">
                    <div class="card-body">
                        <h2 class="h5">Resumen</h2>
                        <div class="d-flex justify-content-between mb-2"><span>Unidades</span><span id="units">0</span>
                        </div>
                        <div class="d-flex justify-content-between border-top pt-3 mb-3"><strong>Total</strong><strong
                                id="total">S/ 0.00</strong></div><button id="checkout" class="btn btn-success w-100"><i
                                class="bi bi-bag-check me-1"></i>Continuar con la compra</button>
                    </div>
                </div>
            </aside>
        </div>
    </main>
    <div id="commonFooter"></div>
    <div class="modal fade" id="checkoutModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="h5 modal-title">Datos para tu entrega</h2><button class="btn-close"
                        data-bs-dismiss="modal"></button>
                </div>
                <form id="checkoutForm" class="modal-body row g-3" novalidate>
                    <div class="col-md-6"><label class="form-label">Nombre completo</label><input id="cNombre"
                            class="form-control" required>
                        <div class="invalid-feedback">Ingresa tu nombre.</div>
                    </div>
                    <div class="col-md-6"><label class="form-label">Correo</label><input id="cCorreo" type="email"
                            class="form-control" required>
                        <div class="invalid-feedback">Correo inválido.</div>
                    </div>
                    <div class="col-md-6"><label class="form-label">Celular</label><input id="cTelefono"
                            class="form-control" pattern="[0-9]{9}" required placeholder="9 dígitos">
                        <div class="invalid-feedback">Usa un celular de 9 dígitos.</div>
                    </div>
                    <div class="col-md-6"><label class="form-label">DNI</label><input id="cDni" class="form-control"
                            pattern="[0-9]{8}" required placeholder="8 dígitos">
                        <div class="invalid-feedback">Ingresa 8 dígitos.</div>
                    </div>
                    <div class="col-md-8"><label class="form-label">Dirección</label><input id="cDireccion"
                            class="form-control" required placeholder="Av. / Jr. / Calle y número">
                        <div class="invalid-feedback">Dirección requerida.</div>
                    </div>
                    <div class="col-md-4"><label class="form-label">Distrito</label><input id="cDistrito"
                            class="form-control" required>
                        <div class="invalid-feedback">Distrito requerido.</div>
                    </div>
                    <div class="col-12"><label class="form-label">Referencia</label><input id="cReferencia"
                            class="form-control" placeholder="Referencia opcional"></div>
                    <div class="col-md-6"><label class="form-label">Método de pago</label><select id="cPago"
                            class="form-select" required>
                            <option value="">Selecciona</option>
                            <option>Tarjeta de crédito/débito</option>
                            <option>Yape / Plin</option>
                            <option>Pago contra entrega</option>
                        </select>
                        <div class="invalid-feedback">Selecciona un método.</div>
                    </div>
                    <div class="col-12">
                        <div id="checkoutError"></div><button class="btn btn-success w-100" type="submit">Confirmar
                            compra</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="/shared/shared.js"></script>
    <script src="/modulo-1-datos-backend/app.js"></script>
    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
