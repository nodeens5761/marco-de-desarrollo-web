<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>AgroMarketPeru · Mi cuenta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/shared/styles.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div id="commonNav"></div>
    <main class="container py-4">
        <div class="row g-4">
            <aside class="col-lg-4">
                <div class="card border-0 soft-shadow">
                    <div class="card-body">
                        <div class="d-flex align-items-center gap-3">
                            <div
                                class="profile-avatar bg-success-subtle rounded-circle d-flex align-items-center justify-content-center">
                                <i class="bi bi-person-fill fs-1 text-success"></i>
                            </div>
                            <div>
                                <div class="small text-secondary">Mi cuenta</div>
                                <h1 id="nombrePerfil" class="h4 mb-0">Cargando...</h1>
                                <div id="correoPerfil" class="small text-secondary"></div>
                            </div>
                        </div>
                        <div class="d-grid gap-2 mt-4"><a class="btn btn-success" href="carrito.html"><i
                                    class="bi bi-cart3 me-1"></i>Mi carrito</a><a class="btn btn-outline-success"
                                href="historial-compras.html"><i class="bi bi-receipt me-1"></i>Historial de
                                compras</a><a class="btn btn-outline-success" href="perfil.html"><i
                                    class="bi bi-person-vcard me-1"></i>Mi perfil</a><a class="btn btn-outline-warning"
                                href="/modulo-4-auth-alertas-perfil/alertas.html"><i class="bi bi-bell me-1"></i>Mis
                                alertas</a><button id="logout" class="btn btn-outline-danger"><i
                                    class="bi bi-box-arrow-right me-1"></i>Cerrar sesión</button></div>
                    </div>
                </div>
            </aside>
            <section class="col-lg-8">
                <div class="card border-0 soft-shadow">
                    <div class="card-body">
                        <h2 class="h4">Tus compras en AgroMarketPeru</h2>
                        <p class="text-secondary">Desde aquí podrás revisar tus pedidos confirmados y sus datos de
                            entrega.</p>
                        <div id="resumenCompras">
                            <div class="text-secondary">Cargando pedidos...</div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <div id="commonFooter"></div>
    <script src="/shared/shared.js"></script>
    <script src="/modulo-1-datos-backend/app.js"></script>
    <script src="app.js"></script>
</body>

</html>
