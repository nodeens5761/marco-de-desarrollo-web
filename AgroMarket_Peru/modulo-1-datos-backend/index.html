<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>AgroMarketPeru · Administrador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/shared/styles.css" rel="stylesheet">
</head>

<body class="bg-light" data-admin="true">
    <div id="commonNav"></div>
    <main class="container py-4">
        <!-- Módulo 1: administración y datos backend simulados -->
        <div class="alert alert-success"><i class="bi bi-database-check me-2"></i>Panel protegido. El proveedor de
            productos sigue siendo el puente para futura API/scraping.</div>

        <!-- Encabezado del panel administrativo -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div><span class="badge text-bg-dark">ADMIN</span>
                <h1 class="h3 d-inline ms-2">Panel de Administración</h1>
            </div><span id="count" class="badge text-bg-success"></span>
        </div>

        <div class="row g-4">
            <!-- Sección principal: tabla de productos disponibles -->
            <section class="col-lg-8">
                <div class="card border-0 soft-shadow">
                    <div class="card-body">
                        <h2 class="h5">Productos simulados</h2>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead>
                                    <tr>
                                        <th>Producto</th>
                                        <th>Categoría</th>
                                        <th>Tienda</th>
                                        <th>Precio</th>
                                    </tr>
                                </thead>
                                <tbody id="tabla"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Sección lateral: formulario para agregar nuevos registros -->
            <section class="col-lg-4">
                <div class="card border-0 soft-shadow">
                    <div class="card-body">
                        <h2 class="h5">Agregar registro</h2>
                        <form id="formProducto"><input id="nombre" class="form-control mb-2" placeholder="Producto"
                                required><select id="categoria" class="form-select mb-2" required>
                                <option value="">Categoría</option>
                                <option>Abarrotes</option>
                                <option>Frutas y Verduras</option>
                                <option>Lácteos</option>
                            </select><input id="tienda" class="form-control mb-2" placeholder="Tienda" required><input
                                id="precio" class="form-control mb-2" type="number" min="0.01" step="0.01"
                                placeholder="Precio S/" required><input id="imagen" class="form-control mb-2" type="url"
                                placeholder="URL imagen" required><input id="url" class="form-control mb-3" type="url"
                                placeholder="URL tienda" required><button class="btn btn-success w-100">Agregar
                                producto</button></form>
                        <div id="msg" class="mt-3"></div>
                    </div>
                </div>
            </section>
        </div>

        <!-- Panel extra para mostrar pedidos recientes del administrador -->
        <section class="card border-0 soft-shadow mt-4">
            <div class="card-body">
                <h2 class="h5">Pedidos recientes</h2>
                <div id="orders">
                    <div class="text-secondary">Cargando...</div>
                </div>
            </div>
        </section>
    </main>
    <script src="/shared/shared.js"></script>
    <script src="app.js"></script>
</body>

</html>
