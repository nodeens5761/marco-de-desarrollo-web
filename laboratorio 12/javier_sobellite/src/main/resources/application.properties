spring.application.name=techlab-web

spring.datasource.url=${TECHLAB_DB_URL:jdbc:mysql://localhost:3306/techlab?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${TECHLAB_DB_USER:techlab}
spring.datasource.password=${TECHLAB_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true

spring.thymeleaf.cache=false
spring.messages.basename=messages
server.error.include-message=never
