<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgroMarketPeru · Historial de precios</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="/shared/styles.css" rel="stylesheet"></head>
<body class="bg-light">
<div id="commonNav"></div>
<main class="container py-4">
<div th:if="${producto == null}" class="alert alert-warning mt-5">Producto no encontrado.</div>
<div th:if="${producto != null}">
<div class="mb-4"><span class="badge text-bg-success" th:text="${producto.tienda}"></span><h1 class="h2 mt-2" th:text="${producto.nombre}"></h1><p class="text-secondary mb-0">Historial almacenado en MySQL y presentado con Thymeleaf.</p></div>
<div class="row g-4">
<div class="col-lg-7"><div class="card border-0 soft-shadow"><div class="card-body"><h2 class="h5">Evolución del precio</h2><canvas id="grafico"></canvas></div></div></div>
<div class="col-lg-5"><div class="card border-0 soft-shadow"><div class="card-body"><h2 class="h5">Registros</h2><div class="table-responsive"><table class="table align-middle" id="tablaHistorial"><thead><tr><th>Fecha</th><th>Precio</th></tr></thead><tbody><tr th:each="h : ${historial}"><td th:text="${#temporals.format(h.registradoEn,'dd/MM/yyyy')}"></td><td th:text="${'S/ ' + #numbers.formatDecimal(h.precio,1,2)}"></td></tr></tbody></table></div><div class="alert alert-light border mb-0"><b>Precio actual:</b> <span th:text="${'S/ ' + #numbers.formatDecimal(producto.precio,1,2)}"></span></div></div></div></div>
</div>
<a class="btn btn-outline-success mt-4" href="/modulo-2-catalogo/index.html"><i class="bi bi-arrow-left me-1"></i>Volver al catálogo</a>
</div>
</main>
<div id="commonFooter"></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="/shared/shared.js"></script>
<script>const filas=[...document.querySelectorAll('#tablaHistorial tbody tr')];const labels=filas.map(x=>x.children[0].textContent.trim());const values=filas.map(x=>Number(x.children[1].textContent.replace('S/','').trim()));const canvas=document.querySelector('#grafico');if(canvas&&values.length)new Chart(canvas,{type:'line',data:{labels,datasets:[{label:'Precio (S/)',data:values,tension:.3}]},options:{responsive:true,scales:{y:{beginAtZero:false}}}})</script>
</body></html>
